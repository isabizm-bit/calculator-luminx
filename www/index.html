<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Purple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #121212;
      color: #eeeeee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px;
      overflow: hidden;
    }

    .display-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 16px 8px;
    }

    .history {
      font-size: 1.2rem;
      color: #888888;
      min-height: 1.5rem;
      margin-bottom: 8px;
    }

    .display {
      font-size: 3.2rem;
      font-weight: 300;
      color: #ffffff;
      word-break: break-all;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 8px;
    }

    button {
      outline: none;
      border: none;
      background-color: #1e1e2e;
      color: #eeeeee;
      font-size: 1.5rem;
      font-weight: 500;
      border-radius: 16px;
      aspect-ratio: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      background-color: #2a2a3d;
      transform: scale(0.96);
    }

    button.accent {
      background-color: #bb86fc;
      color: #000000;
      font-weight: 600;
    }

    button.function {
      color: #bb86fc;
      background-color: #252538;
    }
  </style>
</head>
<body>

  <div class="display-container">
    <div class="history" id="history"></div>
    <div class="display" id="display">0</div>
  </div>

  <div class="keypad">
    <button class="function" onclick="clearAll()">C</button>
    <button class="function" onclick="appendSymbol('(')">(</button>
    <button class="function" onclick="appendSymbol(')')">)</button>
    <button class="accent" onclick="appendSymbol('/')">÷</button>

    <button onclick="appendSymbol('7')">7</button>
    <button onclick="appendSymbol('8')">8</button>
    <button onclick="appendSymbol('9')">9</button>
    <button class="accent" onclick="appendSymbol('*')">×</button>

    <button onclick="appendSymbol('4')">4</button>
    <button onclick="appendSymbol('5')">5</button>
    <button onclick="appendSymbol('6')">6</button>
    <button class="accent" onclick="appendSymbol('-')">−</button>

    <button onclick="appendSymbol('1')">1</button>
    <button onclick="appendSymbol('2')">2</button>
    <button onclick="appendSymbol('3')">3</button>
    <button class="accent" onclick="appendSymbol('+')">+</button>

    <button onclick="appendSymbol('0')">0</button>
    <button onclick="appendSymbol('.')">,</button>
    <button class="function" onclick="deleteLast()">⌫</button>
    <button class="accent" onclick="calculate()">=</button>
  </div>

  <script>
    const displayEl = document.getElementById('display');
    const historyEl = document.getElementById('history');
    let currentInput = '0';
    let isNewCalculation = false;

    function updateDisplay() {
      displayEl.innerText = currentInput;
    }

    function appendSymbol(symbol) {
      if (isNewCalculation && !['+', '-', '*', '/'].includes(symbol)) {
        currentInput = '';
        isNewCalculation = false;
      } else if (isNewCalculation) {
        isNewCalculation = false;
      }

      if (currentInput === '0' && symbol !== '.' && !['+', '-', '*', '/'].includes(symbol)) {
        currentInput = symbol;
      } else {
        currentInput += symbol;
      }
      updateDisplay();
    }

    function clearAll() {
      currentInput = '0';
      historyEl.innerText = '';
      isNewCalculation = false;
      updateDisplay();
    }

    function deleteLast() {
      if (isNewCalculation) {
        clearAll();
        return;
      }
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = '0';
      }
      updateDisplay();
    }

    function calculate() {
      try {
        let expression = currentInput;
        historyEl.innerText = expression;
        let formattedExpression = expression.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
        let result = eval(formattedExpression);
        
        if (result === Infinity || isNaN(result)) {
          currentInput = 'Ошибка';
        } else {
          currentInput = Number(result.toFixed(8)).toString();
        }
        isNewCalculation = true;
      } catch (e) {
        currentInput = 'Ошибка';
        isNewCalculation = true;
      }
      updateDisplay();
    }
  </script>
</body>
</html>
